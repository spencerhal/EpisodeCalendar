name: Update TV Episode Calendar

on:
  schedule:
    - cron: '0 0 * * 0,3' # Runs every Sunday (0) and Wednesday (3) at midnight
  workflow_dispatch: # Allows you to run it manually

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests icalendar

    - name: Run script
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        STREAMING_AVAILABILITY_API_KEY: ${{ secrets.STREAMING_AVAILABILITY_API_KEY }}
      run: python main.py

    - name: Commit and push changes
      run: |
        set -euo pipefail

        FILE=tv_episode_calendar.ics
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Keep the freshly generated calendar out of the way so we can always
        # replay it on top of whatever main looks like right now.
        cp "$FILE" "$RUNNER_TEMP/$FILE"

        for attempt in 1 2 3; do
          git fetch --force origin main:refs/remotes/origin/main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/$FILE" "$FILE"
          git add "$FILE"

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Automated TV Episode Calendar Update [skip ci]"

          if git push origin HEAD:main; then
            echo "Pushed on attempt $attempt"
            exit 0
          fi

          echo "Push rejected on attempt $attempt - main moved, retrying"
          sleep 5
        done

        echo "Could not push after 3 attempts" >&2
        exit 1
