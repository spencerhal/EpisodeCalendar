name: Update Calendar Feed

on:
  schedule:
    - cron: '0 0 * * 0,3' # Runs every Sunday (0) and Wednesday (3) at midnight
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests icalendar letterboxdpy

    - name: Run script
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        LB_USERNAME: ${{ secrets.LB_USERNAME }}
      run: python main.py

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated Calendar Update [skip ci]"
        file_pattern: 'watchlist_releases.ics'
        skip_dirty_check: false    
        skip_fetch: true
