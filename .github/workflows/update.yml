name: Update TV Episode Calendar

on:
  schedule:
    - cron: '0 0 * * 0,3' # Runs every Sunday (0) and Wednesday (3) at midnight
  workflow_dispatch: # Allows you to run it manually

concurrency:
  group: update-calendar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history to avoid shallow clone issues

    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests icalendar

    - name: Run script
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      run: python main.py

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated TV Episode Calendar Update [skip ci]"
        file_pattern: 'tv_episode_calendar.ics'
        skip_dirty_check: false
        skip_fetch: false
        create_branch: false
