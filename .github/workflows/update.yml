name: Update TV Episode Calendar

on:
  schedule:
    - cron: '0 0 * * 0,3' # Runs every Sunday (0) and Wednesday (3) at midnight
  workflow_dispatch: # Allows you to run it manually

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests icalendar

    - name: Run script
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      run: python main.py

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add tv_episode_calendar.ics
        if ! git diff --staged --quiet; then
          git commit -m "Automated TV Episode Calendar Update [skip ci]"
          git pull --rebase origin main
          git push origin main
        else
          echo "No changes to commit"
        fi